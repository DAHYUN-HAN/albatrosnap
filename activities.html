<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 기록 · 알바트로스냅</title>
<link rel="icon" type="image/x-icon" href="icon2.ico">
<meta name="description" content="알바트로스냅이 함께 담은 순간들. 출사, 번개 모임, 전시 관람까지 학기별 활동 기록과 사진을 모았습니다.">

<!-- 카카오톡·SNS 링크 미리보기 (og:image 는 반드시 절대 주소여야 합니다) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="알바트로스냅">
<meta property="og:url" content="https://dahyun-han.github.io/albatrosnap/activities.html">
<meta property="og:title" content="활동 기록 · 알바트로스냅">
<meta property="og:description" content="우리가 함께 담은 순간들. 출사, 번개 모임, 전시 관람까지 학기별 활동 기록과 사진.">
<meta property="og:image" content="https://dahyun-han.github.io/albatrosnap/og.jpg">
<meta property="og:image:width" content="2673">
<meta property="og:image:height" content="1344">
<meta property="og:image:alt" content="카메라를 든 알바트로스냅 마스코트">
<meta name="twitter:card" content="summary_large_image">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --accent: #e8c87a;
    --accent2: #c4a55a;
    --text: #f0ece4;
    --muted: #888;
    --border: #2e2e2e;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 사진 저장 억제 — 꾹 누르기 메뉴, 드래그, 선택을 막는다.
     완전한 보호는 아니고(주소를 알면 받을 수 있다) 무심코 저장하는 걸 막는 정도다. */
  img {
    -webkit-touch-callout: none;      /* iOS 롱프레스 메뉴 */
    -webkit-user-drag: none;
    user-select: none; -webkit-user-select: none;
  }

  .ico { width: 1em; height: 1em; object-fit: contain; display: inline-block; flex-shrink: 0; }
  .ico-inline { width: 1.35em; height: 1.35em; vertical-align: -.32em; margin-right: 8px; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 48px 32px 96px; }

  /* ── 상단 ── */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .1em; color: var(--muted);
    text-decoration: none; transition: color .25s;
  }
  .back-link:hover { color: var(--accent); }

  .eyebrow { font-size: 11px; letter-spacing: .25em; color: var(--accent); margin-bottom: 14px; }
  .page-title { font-size: clamp(32px, 5vw, 52px); font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
  .page-title span { color: var(--accent); }
  .page-desc { margin-top: 16px; font-size: 14px; color: var(--muted); line-height: 1.9; }

  /* ── 연도(드롭다운) + 반기(세그먼트) ──
     해가 쌓여도 가로로 길어지지 않도록 연도는 드롭다운으로 접어 둔다. */
  .picker {
    margin-top: 44px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  /* 라벨과 컨트롤을 한 덩어리로 묶어, 줄이 바뀌어도 둘이 떨어지지 않게 한다 */
  .pick-group { display: flex; align-items: center; gap: 10px; }
  .pick-label {
    font-size: 12px; letter-spacing: .16em; color: #6a6a6a;
    flex-shrink: 0;
  }
  .picker .sep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }

  /* 연도 드롭다운 — 네이티브 select 는 펼친 목록을 OS 가 그려서 어두운 테마와
     따로 논다. 그래서 버튼 + 목록을 직접 만들었다. */
  .year-pick { position: relative; }
  .year-btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: inherit;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px;
    padding: 9px 14px 9px 16px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; white-space: nowrap;
    transition: border-color .25s, background .25s;
  }
  .year-btn:hover { border-color: var(--accent2); background: #2c2c2c; }
  .year-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .year-btn .caret {
    font-size: 10px; color: var(--muted);
    transition: transform .25s, color .25s;
  }
  .year-btn[aria-expanded="true"] { border-color: var(--accent2); }
  .year-btn[aria-expanded="true"] .caret { transform: rotate(180deg); color: var(--accent); }

  .year-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
    min-width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 5px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, .55);
    opacity: 0; visibility: hidden;
    transform: translateY(-4px);
    transition: opacity .18s, transform .18s, visibility .18s;
  }
  .year-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .year-menu button {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    width: 100%;
    font-family: inherit;
    background: none; border: 0; border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    color: var(--muted); white-space: nowrap; text-align: left;
    cursor: pointer;
    transition: background .18s, color .18s;
  }
  .year-menu button:hover { background: #323232; color: var(--text); }
  .year-menu button[aria-selected="true"] { color: var(--accent); }
  .year-menu button[aria-selected="true"]::after { content: '✓'; font-size: 11px; }

  /* 반기 세그먼트 — 두 칸이 한 덩어리로 붙어 있다 */
  .seg {
    display: inline-flex;
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
    background: var(--surface2);
  }
  .seg .term-btn {
    font-family: inherit;
    background: transparent; border: 0; color: var(--muted);
    padding: 9px 18px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; white-space: nowrap;
    transition: color .25s, background .25s;
  }
  .seg .term-btn + .term-btn { border-left: 1px solid var(--border); }
  .seg .term-btn:hover { color: var(--text); background: #2c2c2c; }
  .seg .term-btn.active { background: var(--accent); color: #000; }
  .seg .term-btn.active:hover { background: var(--accent); }
  .term-btn .cnt { font-size: 11px; font-weight: 400; opacity: .75; margin-left: 5px; }

  .term-summary {
    margin-top: 20px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); letter-spacing: .08em;
  }
  .term-summary b { color: var(--accent); font-weight: 700; }

  /* ── 활동 목록 ── */
  .act-list { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  /* 카드 높이는 모든 활동이 똑같이 고정. 사진은 잘려도 줄이 흐트러지지 않는다. */
  .act-item {
    display: flex; align-items: stretch; gap: 0;
    height: 224px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 0; overflow: hidden;
    cursor: pointer; text-align: left; width: 100%;
    font-family: inherit; color: inherit;
    transition: border-color .3s, transform .3s, background .3s;
  }
  .act-item:hover { border-color: var(--accent2); transform: translateX(4px); background: #1d1d1d; }

  /* 썸네일은 카드 왼쪽 끝까지, 위아래로도 꽉 채운다.
     336 x 224 = 3:2 — 3:2 로 만든 썸네일은 잘리지 않고 그대로 들어간다. */
  .act-thumb {
    width: 336px; flex-shrink: 0;
    height: 100%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .act-thumb img.shot {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
  }
  .act-thumb .ico { font-size: 48px; opacity: .5; }

  /* 본문은 위아래 두 칸으로 나누고, 각 칸 안에서 세로 가운데를 맞춘다.
     그러면 가운데 구분선이 카드 정중앙에 온다. */
  .act-body {
    flex: 1; min-width: 0;
    padding: 0 28px;
    display: flex; flex-direction: column;
  }
  /* 위 칸(날짜·제목·부제)이 아래 칸(장소·시간·사진)보다 넉넉하게 */
  .act-main {
    flex: 1.9; min-height: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .act-date { font-size: 11px; letter-spacing: .12em; color: var(--accent); margin-bottom: 9px; }

  /* 아직 다녀오지 않은 활동 표시 */
  .soon {
    display: inline-block; margin-left: 10px;
    background: var(--accent); color: #000;
    border-radius: 100px; padding: 2px 9px;
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    vertical-align: 1px;
  }
  .ov-date .soon { font-size: 11px; padding: 3px 11px; }
  .act-item.is-soon { border-style: dashed; }
  .act-item.is-soon .act-thumb { opacity: .85; }
  .act-title {
    font-size: 23px; font-weight: 700; letter-spacing: -.015em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 부제는 제목 옆이 아니라 아래 줄에 조용히 */
  .act-sub {
    margin-top: 7px;
    font-size: 13px; font-weight: 400; color: #7a7a7a; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 메타는 가는 선 아래 칸에서 세로 가운데. 위 칸보다 좁게 */
  .act-meta {
    flex: 1; min-height: 0;
    border-top: 1px solid var(--border);
    font-size: 11.5px; color: #7a7a7a;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden;
  }
  .act-meta span { display: inline-flex; align-items: center; gap: 5px; padding: 0 12px; }
  .act-meta span:first-child { padding-left: 0; }
  .act-meta span + span { border-left: 1px solid var(--border); }
  .act-meta .ico { font-size: 13px; }

  .act-go {
    display: flex; align-items: center;
    padding: 0 26px 0 10px;
    font-size: 20px; color: #3a3a3a; flex-shrink: 0;
    transition: color .3s, transform .3s;
  }
  .act-item:hover .act-go { color: var(--accent); transform: translateX(3px); }

  /* 비어있는 학기 */
  .empty {
    margin-top: 28px;
    border: 1px dashed var(--border); border-radius: 14px;
    padding: 56px 24px; text-align: center;
  }
  .empty .ico { font-size: 40px; opacity: .35; }
  .empty p { margin-top: 16px; font-size: 13px; color: #666; line-height: 1.9; }

  /* ── 갤러리 오버레이 ── */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8,8,8,.97);
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .ov-inner { max-width: 1040px; margin: 0 auto; padding: 64px 32px 80px; }
  .ov-close {
    position: fixed; top: 24px; right: 28px; z-index: 10;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-size: 20px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s, color .2s;
  }
  .ov-close:hover { background: var(--accent); border-color: var(--accent); color: #000; }

  .ov-date { font-size: 11px; letter-spacing: .2em; color: var(--accent); margin-bottom: 12px; }
  .ov-title { font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: -.02em; }
  .ov-sub { margin-top: 10px; font-size: 15px; color: var(--accent2); letter-spacing: .06em; }
  .ov-meta { margin-top: 14px; font-size: 13px; color: #777; display: flex; gap: 18px; flex-wrap: wrap; }
  .ov-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .ov-desc { margin-top: 22px; font-size: 14px; color: var(--muted); line-height: 1.9; max-width: 640px; }

  /* ── 상세 머리말 : 포스터(왼쪽) + 글(오른쪽) ── */
  /* 포스터는 그 활동의 얼굴이라 다른 자료와 섞지 않고 여기에만 크게 세워 둔다. */
  .ov-hero { margin-bottom: 40px; }
  .ov-hero.has-poster {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 36px;
    align-items: start;
  }
  .ov-hero .ov-poster { margin: 0; }
  .ov-hero .ov-poster img {
    width: 100%; max-height: none;
    border-radius: 12px; border: 1px solid var(--border);
    display: block; cursor: pointer;
    transition: border-color .3s, transform .3s;
  }
  .ov-hero .ov-poster img:hover { border-color: var(--accent2); transform: translateY(-3px); }
  .ov-hero .ov-head { padding-top: 4px; }
  .ov-hero .ov-desc { max-width: none; }

  /* 섹션 제목 (참고 / 사진) */
  .sec-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 14px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }
  .sec-head h3 { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
  .sec-head .hint { font-size: 11px; color: #666; letter-spacing: .06em; }

  /* ── 참고 (카드뉴스) ── */
  /* 순서대로 넘겨 보는 자료라, 정사각형 사진 그리드와 확실히 다르게 보이도록
     세로 카드를 가로로 늘어놓는다. */
  .press { margin-bottom: 36px; }

  .press-strip {
    display: flex; gap: 12px;
    overflow-x: auto; overflow-y: hidden;
    padding-bottom: 12px;
    scroll-snap-type: x mandatory;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .press-strip::-webkit-scrollbar { height: 6px; }
  .press-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }

  .press-card {
    position: relative; flex: 0 0 auto;
    width: 210px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; scroll-snap-align: start;
    transition: border-color .3s, transform .3s;
  }
  .press-card:hover { border-color: var(--accent2); transform: translateY(-3px); }
  .press-card img { width: 100%; display: block; }
  .press-card .no {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,.65); color: var(--text);
    border-radius: 100px; padding: 2px 9px;
    font-size: 10px; letter-spacing: .08em;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .photo {
    aspect-ratio: 1;
    border-radius: 12px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .3s, transform .3s;
  }
  .photo:hover { border-color: var(--accent2); transform: translateY(-3px); }
  .photo img.shot { width: 100%; height: 100%; object-fit: cover; display: block; }

  .no-photo { font-size: 13px; color: #666; letter-spacing: .05em; }

  /* ── 라이트박스 ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.96);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .lightbox.open { opacity: 1; pointer-events: all; }
  .lb-stage { position: relative; display: flex; }
  .lightbox img {
    max-width: 90vw; max-height: 84vh; object-fit: contain; border-radius: 6px;
    touch-action: pan-y;
  }
  /* 사진 위에 투명한 층을 덮는다. 꾹 눌러도 이미지가 아니라 이 층이 잡힌다. */
  .lb-shield { position: absolute; inset: 0; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(36,36,36,.85); border: 1px solid var(--border); color: var(--text);
    font-size: 20px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .lb-nav:hover { background: var(--accent); color: #000; }
  .lb-prev { left: 28px; }
  .lb-next { right: 28px; }
  .lb-close { position: absolute; top: 24px; right: 28px; }
  .lb-count {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); letter-spacing: .15em;
  }

  /* ── 모바일 ── */
  @media (max-width: 600px) {
    .wrap { padding: 32px 20px 72px; }
    .top-bar { margin-bottom: 32px; }
    .picker { margin-top: 32px; gap: 10px 14px; }
    .picker .sep { display: none; }
    .pick-group { gap: 8px; }
    .pick-label { font-size: 11px; letter-spacing: .12em; }
    .year-pick select { padding: 8px 32px 8px 13px; font-size: 13px; }
    .seg .term-btn { padding: 8px 13px; font-size: 12px; }
    .term-btn .cnt { font-size: 10px; }

    /* 좁은 화면에서는 사진을 위로 올리고 글을 아래에 쌓는다 (여기도 높이 고정) */
    /* 카드 폭이 모두 같으므로 3:2 로 두면 사진 높이도 저절로 같아진다 */
    .act-item { flex-direction: column; height: auto; border-radius: 12px; }
    .act-item:hover { transform: none; }
    .act-thumb { width: 100%; height: auto; aspect-ratio: 3 / 2; }
    .act-thumb .ico { font-size: 40px; }
    /* 사진이 위로 올라간 세로 카드라, 글도 가운데로 모은다 */
    .act-body { flex: none; height: 152px; padding: 0 18px; text-align: center; }
    .act-title { font-size: 19px; }
    .act-sub { font-size: 12px; margin-top: 5px; }
    .act-meta {
      font-size: 11px;
      justify-content: center;
      flex-wrap: wrap; white-space: normal;
      gap: 5px 14px;
    }
    /* 줄이 바뀌면 세로 구분선이 줄 맨 앞에 남으므로, 모바일에서는 간격으로만 나눈다 */
    .act-meta span { padding: 0; gap: 4px; }
    .act-meta span + span { border-left: 0; }
    .act-go { display: none; }
    .ov-sub { font-size: 13px; }

    .ov-inner { padding: 56px 20px 64px; }
    .ov-close { top: 16px; right: 16px; width: 38px; height: 38px; font-size: 18px; }
    .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }

    /* 좁은 화면에서는 포스터를 위, 글을 아래로 */
    .ov-hero { margin-bottom: 30px; }
    .ov-hero.has-poster { grid-template-columns: 1fr; gap: 22px; }
    .ov-hero .ov-poster { max-width: 260px; }
    .sec-head { padding-top: 18px; }
    .press { margin-bottom: 28px; }
    .press-card { width: 160px; }

    .lb-nav { width: 40px; height: 40px; font-size: 16px; }
    .lb-prev { left: 10px; }
    .lb-next { right: 10px; }
    .lb-close { top: 16px; right: 16px; }
  }

                          note(사진이 없을 때 대신 보여줄 문구)

   ▸ 사진 폴더 구조     : photos/<연도>/<반기>/<활동폴더>/01.jpg, 02.jpg ...
                                                       /poster.jpg   (선택)

   ▸ photos             : 사진 경로 배열.
                          - 번호순 자동 : seq('photos/<연도>/<반기>/<폴더>', 12)
                            → .../01.jpg ~ .../12.jpg 를 자동 생성 (확장자 바꾸려면

                          - 직접 나열도 됨 : ['photos/.../a.jpg', '...']
                          사진이 아직 없으면 seq(..., 0) 으로 두면
                          sync_photos.py 가 나중에 숫자를 채워 줍니다.
   ▸ 사진을 넣거나 뺀 뒤 : python sync_photos.py  를 실행하면 번호와 장수가
                          자동으로 맞춰집니다.
   ═══════════════════════════════════════════════════════════════ */

/** dir 안의 01.ext ~ n.ext 경로를 만들어 줍니다. */
function seq(dir, n, ext) {
  ext = ext || 'jpg';
  return Array.from({ length: n }, (_, i) =>
    dir + '/' + String(i + 1).padStart(2, '0') + '.' + ext);
}

/* ═══════════════ 이 아래는 수정하지 않아도 됩니다 ═══════════════ */

const yearBtn   = document.getElementById('yearBtn');
const yearLabel = document.getElementById('yearLabel');
const yearMenu  = document.getElementById('yearMenu');
const halvesEl  = document.getElementById('halves');
const summaryEl = document.getElementById('summary');
const listEl    = document.getElementById('listArea');
const overlay   = document.getElementById('overlay');
const ovInner   = document.getElementById('ovInner');
const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lbImg');
const lbCount   = document.getElementById('lbCount');

const HALVES = [{ n: 1, label: '상반기' }, { n: 2, label: '하반기' }];

const allYears = () => [...new Set(TERMS.map(t => t.year))].sort((a, b) => a - b);
const termOf   = (y, h) => TERMS.find(t => t.year === y && t.half === h);
const actsOf   = (y, h) => (termOf(y, h) || {}).activities || [];

// 가장 최근 연도에서, 활동이 있는 반기를 기본으로 연다
let curYear = allYears()[allYears().length - 1];
let curHalf = actsOf(curYear, 2).length ? 2 : 1;

let lbList = [];
let lbIdx = 0;

const iconPath = name => 'icons/' + (name || 'camera') + '.png';

const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

function weekday(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return DAYS[new Date(y, m - 1, d).getDay()];
}

/** '2026-06-06' → '2026. 06. 06 (토)',  end 가 있으면 '… ~ 08. 09 (일)' */
function fmtDate(iso, end) {
  const head = iso.split('-').join('. ') + ' (' + weekday(iso) + ')';
  if (!end) return head;
  const [ey, em, ed] = end.split('-');
  const tail = (ey === iso.split('-')[0] ? '' : ey + '. ') + em + '. ' + ed;
  return head + ' ~ ' + tail + ' (' + weekday(end) + ')';
}

/** 파일을 지우면 그 자리도 같이 사라지도록, 없는 사진은 조용히 제거한다 */
function dropIfMissing(img, box, onGone) {
  img.addEventListener('error', () => {
    box.remove();
    if (onGone) onGone();
  });
}

/* ── 연도 / 반기 선택 ── */

/** 활동 목록을 '(6회)' 같은 짧은 괄호 문구로 */
function countLabel(acts) {
  const done = acts.filter(a => !a.upcoming).length;
  const soon = acts.length - done;
  if (done) return '(' + done + '회' + (soon ? ' · 예정 ' + soon : '') + ')';
  return soon ? '(예정 ' + soon + ')' : '(준비 중)';
}

function makeBtn(parent, label, count, active, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'term-btn' + (active ? ' active' : '');
  b.innerHTML = label + (count ? '<span class="cnt">' + count + '</span>' : '');
  b.addEventListener('click', onClick);
  parent.appendChild(b);
}

function renderTerms() {
  // 연도는 드롭다운 — 해가 쌓여도 가로 폭이 늘지 않는다
  yearLabel.textContent = curYear + '년';
  yearMenu.innerHTML = '';
  allYears().forEach(y => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', y === curYear);
    b.innerHTML = '<span>' + y + '년</span>';
    b.addEventListener('click', () => { pickYear(y); closeYearMenu(); });
    yearMenu.appendChild(b);
  });

  halvesEl.innerHTML = '';
  HALVES.forEach(h => {
    makeBtn(halvesEl, h.label, countLabel(actsOf(curYear, h.n)),
      h.n === curHalf, () => { curHalf = h.n; render(); });
  });
}

/* ── 연도 드롭다운 열고 닫기 ── */
function openYearMenu() {
  yearMenu.classList.add('open');
  yearBtn.setAttribute('aria-expanded', 'true');
}
function closeYearMenu() {
  yearMenu.classList.remove('open');
  yearBtn.setAttribute('aria-expanded', 'false');
}
function pickYear(y) {
  curYear = y;
  // 그 해에 지금 반기가 비어 있으면 활동이 있는 쪽으로 옮긴다
  if (!actsOf(curYear, curHalf).length) {
    const other = HALVES.find(h => actsOf(curYear, h.n).length);
    if (other) curHalf = other.n;
  }
  render();
}

yearBtn.addEventListener('click', e => {
  e.stopPropagation();
  yearMenu.classList.contains('open') ? closeYearMenu() : openYearMenu();
});
document.addEventListener('click', e => {
  if (!yearMenu.contains(e.target)) closeYearMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && yearMenu.classList.contains('open')) {
    closeYearMenu();
    yearBtn.focus();
  }
});

/* ── 활동 목록 ── */
function renderList() {
  const termName = curYear + '년 ' + HALVES.find(h => h.n === curHalf).label;
  // 날짜순(오래된 것 → 최근). 최신순으로 보고 싶으면 a.date/b.date 를 바꾸면 된다.
  const acts = actsOf(curYear, curHalf).slice().sort((a, b) => a.date.localeCompare(b.date));
  const shots = acts.reduce((n, a) => n + (a.photos ? a.photos.length : 0), 0);
  const done = acts.filter(a => !a.upcoming).length;
  const soon = acts.length - done;

  summaryEl.innerHTML = acts.length
    ? [done ? '활동 <b>' + done + '회</b>' : '',
       shots ? '사진 <b>' + shots + '장</b>' : '',
       soon ? '예정 <b>' + soon + '건</b>' : ''].filter(Boolean).join(' · ')
    : '아직 기록된 활동이 없습니다.';

  listEl.innerHTML = '';

  if (!acts.length) {
    listEl.innerHTML =
      '<div class="empty"><img class="ico" src="' + iconPath('camera') + '" alt="">' +
      '<p>' + termName + ' 활동은 아직 준비 중입니다.<br>곧 새로운 순간들로 채워집니다.</p></div>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'act-list';

  acts.forEach(a => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'act-item' + (a.upcoming ? ' is-soon' : '');

    const thumb = document.createElement('div');
    thumb.className = 'act-thumb';
    // 목록 표지 우선순위: 전용 썸네일 → 포스터 → 첫 사진
    const cover = a.thumb || a.poster || (a.photos && a.photos.length ? a.photos[0] : null);
    if (cover) {
      const im = document.createElement('img');
      im.className = 'shot';
      im.alt = '';
      // 썸네일이 사라지면 아이콘으로 되돌린다
      im.addEventListener('error', () => {
        thumb.innerHTML = '<img class="ico" src="' + iconPath(a.icon) + '" alt="">';
      });
      im.src = cover;
      thumb.appendChild(im);
    } else {
      thumb.innerHTML = '<img class="ico" src="' + iconPath(a.icon) + '" alt="">';
    }

    const body = document.createElement('div');
    body.className = 'act-body';
    const meta = [];
    if (a.place)  meta.push('<span><img class="ico" src="' + iconPath('pin') + '" alt="">' + a.place + '</span>');
    if (a.time)   meta.push('<span><img class="ico" src="' + iconPath('clock') + '" alt="">' + a.time + '</span>');
    if (a.people) meta.push('<span><img class="ico" src="' + iconPath('person') + '" alt="">' + a.people + '명</span>');
    meta.push('<span><img class="ico" src="' + iconPath('frame') + '" alt="">사진 ' +
      (a.photos && a.photos.length ? a.photos.length + '장'
        : (a.upcoming ? '준비 중' : '정리 중')) + '</span>');

    body.innerHTML =
      '<div class="act-main">' +
        '<div class="act-date">' + fmtDate(a.date, a.endDate) +
          (a.upcoming ? '<span class="soon">예정</span>' : '') + '</div>' +
        '<div class="act-title">' + a.title + '</div>' +
        (a.subtitle ? '<div class="act-sub">' + a.subtitle + '</div>' : '') +
      '</div>' +
      '<div class="act-meta">' + meta.join('') + '</div>';

    const go = document.createElement('div');
    go.className = 'act-go';
    go.textContent = '→';

    item.append(thumb, body, go);
    item.addEventListener('click', () => openGallery(a));
    wrap.appendChild(item);
  });

  listEl.appendChild(wrap);
}

function render() { renderTerms(); renderList(); }

/* ── 활동 상세 + 사진 갤러리 ── */
function openGallery(a) {
  const meta = [];
  if (a.place)  meta.push('<span><img class="ico" src="' + iconPath('pin') + '" alt="">' + a.place + '</span>');
  if (a.time)   meta.push('<span><img class="ico" src="' + iconPath('clock') + '" alt="">' + a.time + '</span>');
  if (a.people) meta.push('<span><img class="ico" src="' + iconPath('person') + '" alt="">' + a.people + '명 참여</span>');

  /* ── 머리말 ──
     포스터가 있으면 왼쪽에 세워 두고 오른쪽에 글을 배치한다.
     포스터는 그 활동의 얼굴이라 다른 자료와 섞지 않고 이 자리에만 둔다. */
  const head =
    '<div class="ov-date">' + fmtDate(a.date, a.endDate) +
      (a.upcoming ? '<span class="soon">예정</span>' : '') + '</div>' +
    '<h2 class="ov-title"><img class="ico ico-inline" src="' + iconPath(a.icon) + '" alt="">' + a.title + '</h2>' +
    (a.subtitle ? '<p class="ov-sub">‹ ' + a.subtitle + ' ›</p>' : '') +
    (meta.length ? '<div class="ov-meta">' + meta.join('') + '</div>' : '') +
    (a.desc ? '<p class="ov-desc">' + a.desc + '</p>' : '');

  ovInner.innerHTML = a.poster
    ? '<div class="ov-hero has-poster">' +
        '<div class="ov-poster"><img alt="' + a.title + ' 포스터" src="' + a.poster + '"></div>' +
        '<div class="ov-head">' + head + '</div>' +
      '</div>'
    : '<div class="ov-hero">' + head + '</div>';

  const posterImg = ovInner.querySelector('.ov-poster img');
  if (posterImg) {
    posterImg.addEventListener('click', () => openLightbox([a.poster], 0));
    posterImg.addEventListener('error', () => {
      ovInner.querySelector('.ov-hero').classList.remove('has-poster');
      posterImg.parentElement.remove();
    });
  }

  /* ── 참고 (카드뉴스) ── */
  const notice = a.notice || [];
  if (notice.length) {
    const wrap = document.createElement('div');
    wrap.className = 'press';
    wrap.innerHTML =
      '<div class="sec-head"><h3>참고</h3>' +
      '<span class="hint">' + notice.length + '장 · 옆으로 넘겨 보세요</span></div>';

    const strip = document.createElement('div');
    strip.className = 'press-strip';
    const live = notice.slice();
    notice.forEach((src, i) => {
      const card = document.createElement('div');
      card.className = 'press-card';
      const im = document.createElement('img');
      im.alt = a.title + ' 공지 ' + (i + 1);
      im.loading = 'lazy';
      im.addEventListener('error', () => {
        const k = live.indexOf(src);
        if (k > -1) live.splice(k, 1);
        card.remove();
        if (!strip.children.length) wrap.remove();
      });
      im.src = src;
      card.appendChild(im);
      card.insertAdjacentHTML('beforeend', '<span class="no">' + (i + 1) + '</span>');
      card.addEventListener('click', () => openLightbox(live, live.indexOf(src)));
      strip.appendChild(card);
    });
    wrap.appendChild(strip);
    ovInner.appendChild(wrap);
  }

  if (a.photos && a.photos.length) {
    // 참고가 함께 있을 때만 '사진' 제목을 붙여 두 묶음을 구분한다
    if (notice.length) {
      ovInner.insertAdjacentHTML('beforeend',
        '<div class="sec-head"><h3>사진</h3>' +
        '<span class="hint">' + a.photos.length + '장</span></div>');
    }
    // 실제로 존재하는 사진만 남긴다 (파일을 지우면 목록에서도 사라진다)
    const live = a.photos.slice();
    const grid = document.createElement('div');
    grid.className = 'photo-grid';
    a.photos.forEach((src, i) => {
      const box = document.createElement('div');
      box.className = 'photo';
      const im = document.createElement('img');
      im.className = 'shot';
      im.alt = a.title + ' 사진 ' + (i + 1);
      im.loading = 'lazy';
      dropIfMissing(im, box, () => {
        const k = live.indexOf(src);
        if (k > -1) live.splice(k, 1);
        if (!grid.children.length) grid.remove();
      });
      im.src = src;
      box.appendChild(im);
      box.addEventListener('click', () => openLightbox(live, live.indexOf(src)));
      grid.appendChild(box);
    });
    ovInner.appendChild(grid);
  } else {
    const p = document.createElement('p');
    p.className = 'no-photo';
    p.textContent = a.note || (a.upcoming
      ? '아직 다녀오지 않은 활동입니다. 다녀온 뒤 사진으로 채워집니다.'
      : '사진을 정리하는 중입니다. 조금만 기다려 주세요.');
    ovInner.appendChild(p);
  }

  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ view: 'gallery' }, '');   // 뒤로가기로 닫을 수 있게
}

/* ── 사진 확대 ── */
function openLightbox(list, i) {
  lbList = list;
  showLb(i);
  lightbox.classList.add('open');
  history.pushState({ view: 'photo' }, '');
}
function showLb(i) {
  lbIdx = (i + lbList.length) % lbList.length;
  lbImg.src = lbList[lbIdx];
  const many = lbList.length > 1;
  lbCount.textContent = many ? (lbIdx + 1) + ' / ' + lbList.length : '';
  document.getElementById('lbPrev').style.display = many ? '' : 'none';
  document.getElementById('lbNext').style.display = many ? '' : 'none';
}
/* ── 닫기 ──
   화면을 실제로 감추는 hide*() 와, 닫기 버튼·Esc·배경 클릭이 부르는 close*() 를
   나눠 둔다. close*() 는 history.back() 을 부르고, 실제로 감추는 일은 popstate 가
   맡는다. 이렇게 해야 X 로 닫든 브라우저 뒤로가기로 닫든 히스토리가 어긋나지 않는다. */
function hideGallery() {
  overlay.classList.remove('open');
  if (!lightbox.classList.contains('open')) document.body.style.overflow = '';
}
function hideLightbox() {
  lightbox.classList.remove('open');
  if (!overlay.classList.contains('open')) document.body.style.overflow = '';
}
function closeGallery()  { if (overlay.classList.contains('open'))  history.back(); }
function closeLightbox() { if (lightbox.classList.contains('open')) history.back(); }

// 브라우저 뒤로가기 = 위에 떠 있는 창 하나만 닫기 (페이지를 벗어나지 않는다)
window.addEventListener('popstate', () => {
  if (lightbox.classList.contains('open'))     hideLightbox();
  else if (overlay.classList.contains('open')) hideGallery();
});

document.getElementById('ovClose').addEventListener('click', closeGallery);
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => showLb(lbIdx - 1));
document.getElementById('lbNext').addEventListener('click', () => showLb(lbIdx + 1));

overlay.addEventListener('click', e => { if (e.target === overlay) closeGallery(); });

/* ── 사진 저장 억제 ──
   이미지 위에서만 우클릭·롱프레스 메뉴와 드래그를 막는다. 페이지 전체를 막으면
   뒤로가기 같은 정상적인 동작까지 불편해진다.
   주소를 직접 열거나 화면을 캡처하는 것까지는 막을 수 없다. */
document.addEventListener('contextmenu', e => {
  if (e.target.tagName === 'IMG' || e.target.classList.contains('lb-shield')) {
    e.preventDefault();
  }
});
document.addEventListener('dragstart', e => {
  if (e.target.tagName === 'IMG') e.preventDefault();
});

/* ── 모바일 스와이프로 사진 넘기기 ── */
let swiped = false, tx = 0, ty = 0;

lightbox.addEventListener('click', e => {
  // 스와이프 뒤에도 click 이 따라오므로, 넘긴 직후에는 닫지 않는다
  if (swiped) { swiped = false; return; }
  if (e.target === lightbox) closeLightbox();
});

lightbox.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  tx = t.clientX; ty = t.clientY;
  swiped = false;
}, { passive: true });

lightbox.addEventListener('touchend', e => {
  if (lbList.length < 2) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx;
  const dy = t.clientY - ty;
  // 가로로 충분히, 그리고 세로보다 확실히 많이 움직였을 때만 넘긴다
  if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  swiped = true;
  showLb(lbIdx + (dx < 0 ? 1 : -1));
}, { passive: true });

document.addEventListener('keydown', e => {
  if (lightbox.classList.contains('open')) {
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  showLb(lbIdx - 1);
    if (e.key === 'ArrowRight') showLb(lbIdx + 1);
    return;
  }
  if (overlay.classList.contains('open') && e.key === 'Escape') closeGallery();
});

render();
</script>
</body>
</html>
